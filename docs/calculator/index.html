<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#14202b">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚡</text></svg>">
<title>峰值 Peakwise｜工廠儲能值不值得</title>
<meta name="description" content="工廠裝儲能划不划算？免登入、免上傳，用台電電費單 60 秒算出回收年限、報酬率與合理報價。Is a factory battery worth it in Taiwan? 60-second neutral check.">
<style>
  :root {
    --ink: #17212b;
    --muted: #5b6b7b;
    --accent: #0f7b5f;
    --accent-soft: #e6f4ef;
    --good: #0f7b5f;
    --good-soft: #e3f5ee;
    --maybe: #a86207;
    --maybe-soft: #fdf3e2;
    --bad: #b42318;
    --bad-soft: #fdecea;
    --card: #ffffff;
    --bg: #f2f5f7;
    --line: #dde4ea;
    --radius: 12px;
  }
  * {
    box-sizing: border-box;
  }
  body {
    margin: 0;
    font-family: "Noto Sans TC", "Microsoft JhengHei", "PingFang TC", "Segoe UI", Arial, sans-serif;
    color: var(--ink);
    background: var(--bg);
    line-height: 1.45;
  }
  a {
    color: inherit;
  }
  .top {
    background: linear-gradient(135deg, #14202b 0%, #1d3240 100%);
    color: #fff;
    padding: 18px 28px 16px;
  }
  .top-row {
    display: flex;
    flex-wrap: wrap;
    align-items: flex-end;
    justify-content: space-between;
    gap: 12px;
  }
  .brand {
    font-size: 13px;
    color: #8fe3c4;
    text-decoration: none;
    letter-spacing: 0.02em;
  }
  .brand:hover {
    text-decoration: underline;
  }
  .top h1 {
    margin: 2px 0 2px;
    font-size: 28px;
    letter-spacing: 0.01em;
  }
  .top .sub {
    margin: 0;
    font-size: 14px;
    opacity: 0.85;
  }
  .actions {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }
  .btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 7px 13px;
    border: 1px solid rgba(255, 255, 255, 0.7);
    border-radius: 8px;
    background: transparent;
    color: #fff;
    font: inherit;
    font-size: 13px;
    text-decoration: none;
    cursor: pointer;
    white-space: nowrap;
  }
  .btn:hover {
    background: rgba(255, 255, 255, 0.12);
  }
  .btn.primary {
    background: #22c08f;
    border-color: #22c08f;
    color: #08231a;
    font-weight: 700;
  }
  .btn.primary:hover {
    background: #3ad3a2;
  }
  .chips {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin: 12px 0 0;
    padding: 0;
    list-style: none;
  }
  .chips li {
    padding: 3px 10px;
    border-radius: 999px;
    background: rgba(143, 227, 196, 0.14);
    color: #c9f3e2;
    font-size: 12px;
  }
  .chips li::before {
    content: "✓ ";
    color: #8fe3c4;
  }
  main {
    display: grid;
    grid-template-columns: minmax(300px, 400px) minmax(0, 1fr);
    gap: 20px;
    padding: 20px 28px 32px;
    max-width: 1320px;
    margin: 0 auto;
  }
  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 18px 20px;
    min-width: 0;
  }
  .stack {
    display: grid;
    gap: 16px;
    min-width: 0;
  }
  @media (min-width: 901px) {
    .left {
      position: sticky;
      top: 16px;
      max-height: calc(100vh - 32px);
      overflow-y: auto;
    }
  }
  h2 {
    margin: 0 0 10px;
    font-size: 17px;
  }
  h3 {
    margin: 0 0 8px;
    font-size: 15px;
  }
  .lead {
    margin: -4px 0 10px;
    font-size: 12px;
    color: var(--muted);
  }
  label.field {
    display: grid;
    grid-template-columns: minmax(0, 1fr) 120px;
    align-items: center;
    gap: 8px;
    margin: 8px 0;
    font-size: 13px;
  }
  label.check {
    display: flex;
    gap: 8px;
    align-items: flex-start;
    margin: 9px 0;
    font-size: 13px;
  }
  label.check input {
    margin-top: 3px;
  }
  input[type="number"] {
    width: 100%;
    padding: 7px 9px;
    border: 1px solid var(--line);
    border-radius: 7px;
    font: inherit;
    font-size: 14px;
    text-align: right;
    background: #fbfcfd;
  }
  input[type="number"]:focus {
    outline: 2px solid #9fdcc6;
    border-color: var(--accent);
  }
  input.invalid {
    border-color: var(--bad);
    background: var(--bad-soft);
  }
  .hint {
    display: block;
    font-size: 12px;
    color: var(--muted);
  }
  details {
    margin-top: 10px;
    border-top: 1px dashed var(--line);
    padding-top: 8px;
  }
  summary {
    cursor: pointer;
    font-size: 13px;
    color: var(--accent);
  }
  .verdict {
    border-radius: var(--radius);
    padding: 18px 22px;
    border: 1px solid;
  }
  .verdict.good {
    background: var(--good-soft);
    border-color: #a7dcc8;
  }
  .verdict.maybe {
    background: var(--maybe-soft);
    border-color: #f0cf93;
  }
  .verdict.bad {
    background: var(--bad-soft);
    border-color: #f2b8b2;
  }
  .verdict .tag {
    display: inline-block;
    padding: 2px 10px;
    border-radius: 999px;
    font-size: 12px;
    font-weight: 700;
    color: #fff;
  }
  .verdict.good .tag {
    background: var(--good);
  }
  .verdict.maybe .tag {
    background: var(--maybe);
  }
  .verdict.bad .tag {
    background: var(--bad);
  }
  .verdict h2 {
    margin: 8px 0 6px;
    font-size: 22px;
  }
  .verdict p {
    margin: 4px 0;
    font-size: 15px;
  }
  .verdict .why {
    font-size: 13px;
    color: var(--muted);
  }
  .kpis {
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 12px;
  }
  .kpi {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 12px 14px;
  }
  .kpi .label {
    font-size: 12px;
    color: var(--muted);
  }
  .kpi .value {
    font-size: 22px;
    font-weight: 700;
    color: var(--accent);
    white-space: nowrap;
  }
  .kpi .value.bad {
    color: var(--bad);
  }
  .kpi .value.maybe {
    color: var(--maybe);
  }
  .kpi .note {
    font-size: 12px;
    color: var(--muted);
  }
  .tablewrap {
    overflow-x: auto;
    /* scroll cue: an edge shadow appears only on the side that has more columns */
    background:
      linear-gradient(to right, var(--card) 30%, rgba(255, 255, 255, 0)) left center / 28px 100% no-repeat local,
      linear-gradient(to left, var(--card) 30%, rgba(255, 255, 255, 0)) right center / 28px 100% no-repeat local,
      radial-gradient(farthest-side at 0 50%, rgba(23, 33, 43, 0.2), rgba(23, 33, 43, 0)) left center / 12px 100% no-repeat scroll,
      radial-gradient(farthest-side at 100% 50%, rgba(23, 33, 43, 0.2), rgba(23, 33, 43, 0)) right center / 12px 100% no-repeat scroll;
  }
  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
  }
  th,
  td {
    padding: 7px 8px;
    border-bottom: 1px solid var(--line);
    text-align: right;
    white-space: nowrap;
  }
  th {
    color: var(--muted);
    font-weight: 600;
  }
  th:first-child,
  td:first-child {
    text-align: left;
    white-space: normal;
  }
  tr.best td {
    background: var(--accent-soft);
    font-weight: 700;
  }
  .neg {
    color: var(--bad);
  }
  .chartbox {
    position: relative;
  }
  canvas {
    display: block;
    width: 100%;
    height: 240px;
  }
  .quote-grid {
    display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
    gap: 16px;
    align-items: start;
  }
  .stat {
    display: flex;
    justify-content: space-between;
    gap: 10px;
    padding: 7px 0;
    border-bottom: 1px solid var(--line);
    font-size: 13px;
  }
  .stat b {
    white-space: nowrap;
  }
  .pill {
    margin-top: 10px;
    padding: 9px 12px;
    border-radius: 8px;
    font-size: 13px;
  }
  .pill.good {
    background: var(--good-soft);
    color: #0b5a45;
  }
  .pill.bad {
    background: var(--bad-soft);
    color: #8a1c12;
  }
  .pill.info {
    background: #eef3f7;
    color: var(--muted);
  }
  ol.steps {
    margin: 0;
    padding-left: 20px;
    font-size: 14px;
  }
  ol.steps li {
    margin: 6px 0;
  }
  .notice {
    padding: 12px 14px;
    border-left: 4px solid var(--maybe);
    background: #fdf6ee;
    font-size: 12px;
    color: #6b3a17;
    border-radius: 0 8px 8px 0;
  }
  footer {
    max-width: 1320px;
    margin: 0 auto;
    padding: 0 28px 30px;
    font-size: 12px;
    color: var(--muted);
  }
  .left {
    align-self: start;
    display: grid;
    gap: 16px;
    min-width: 0;
  }
  .howto ul {
    margin: 0;
    padding-left: 18px;
    font-size: 12.5px;
    color: var(--muted);
  }
  .howto li {
    margin: 5px 0;
  }
  .howto a {
    color: var(--accent);
  }
  .presets {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 6px;
    margin: 0 0 8px;
    font-size: 12px;
    color: var(--muted);
  }
  .preset {
    padding: 4px 10px;
    border: 1px solid var(--line);
    border-radius: 999px;
    background: #f7faf9;
    color: var(--ink);
    font: inherit;
    font-size: 12px;
    cursor: pointer;
  }
  .preset:hover,
  .preset.active {
    border-color: var(--accent);
    background: var(--accent-soft);
    color: var(--accent);
  }
  .echo {
    display: block;
    font-size: 12px;
    color: var(--accent);
  }
  .btn.line {
    background: #06c755;
    border-color: #06c755;
    color: #06231a;
    font-weight: 700;
  }
  .btn.line:hover {
    background: #19d466;
  }
  .reset {
    float: right;
    border: 0;
    background: none;
    color: var(--accent);
    font: inherit;
    font-size: 12px;
    cursor: pointer;
    text-decoration: underline;
  }
  .sizenote {
    margin: 8px 0 0;
    font-size: 12px;
    color: var(--muted);
  }
  .livebar {
    display: none;
  }
  @media (max-width: 900px) {
    .livebar {
      position: fixed;
      left: 10px;
      right: 10px;
      bottom: 10px;
      z-index: 5;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 10px 14px;
      border: 0;
      border-radius: 12px;
      color: #fff;
      font: inherit;
      font-size: 14px;
      text-align: left;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.25);
      cursor: pointer;
    }
    .livebar.good {
      background: var(--good);
    }
    .livebar.maybe {
      background: var(--maybe);
    }
    .livebar.bad {
      background: var(--bad);
    }
    .livebar b {
      white-space: nowrap;
    }
    body {
      padding-bottom: 70px;
    }
  }
  .toast {
    position: fixed;
    left: 50%;
    bottom: 24px;
    transform: translateX(-50%);
    padding: 9px 16px;
    border-radius: 8px;
    background: #17212b;
    color: #fff;
    font-size: 13px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s;
  }
  .toast.show {
    opacity: 1;
  }
  #testout {
    white-space: pre-wrap;
    font-size: 12px;
    background: #111;
    color: #9f9;
    padding: 10px;
  }
  @media (max-width: 900px) {
    main {
      grid-template-columns: minmax(0, 1fr);
      padding: 14px 14px 28px;
    }
    .top {
      padding: 16px 16px 14px;
    }
    footer {
      padding: 0 16px 24px;
    }
    .kpis {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }
    .quote-grid {
      grid-template-columns: minmax(0, 1fr);
    }
    /* phone/tablet reading order: inputs -> answer -> evidence; the method note comes last */
    .left {
      display: contents;
    }
    #inputs {
      order: 1;
    }
    #results {
      order: 2;
    }
    .howto {
      order: 3;
    }
  }
  @media (min-width: 901px) {
    #shareButton {
      display: none;
    }
  }
  @media (max-width: 600px) {
    #copySummaryButton,
    #emailLink,
    #printButton {
      display: none;
    }
    .btn {
      padding: 7px 11px;
    }
  }
  @media (max-width: 600px) {
    .brand,
    .reset {
      display: inline-flex;
      align-items: center;
      min-height: 44px;
    }
    .preset {
      min-height: 40px;
      padding: 6px 8px;
      line-height: 1.25;
      text-align: center;
    }
    /* three examples as one even row instead of two chips plus an orphan */
    .presets {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      align-items: stretch;
    }
    .presets > span {
      grid-column: 1 / -1;
    }
    /* give Details labels room; long values wrap instead of squeezing labels */
    #detailTable td:first-child {
      width: 55%;
    }
    #detailTable td:last-child {
      white-space: normal;
    }
    label.check input {
      width: 32px;
      height: 32px;
      margin-top: 0;
      flex: none;
      accent-color: var(--accent);
    }
    label.check {
      align-items: center;
    }
  }
  @media (max-width: 420px) {
    label.field {
      grid-template-columns: minmax(0, 1fr) 104px;
    }
    .top h1 {
      font-size: 24px;
    }
    .verdict h2 {
      font-size: 19px;
    }
    .kpi .value {
      font-size: 19px;
    }
  }
  @media print {
    .actions,
    .chips,
    #inputs details,
    .noprint,
    .toast {
      display: none !important;
    }
    body {
      background: #fff;
    }
    .top {
      background: #fff;
      color: var(--ink);
      padding: 0 0 8px;
      border-bottom: 2px solid var(--ink);
    }
    .brand {
      color: var(--accent);
    }
    main {
      grid-template-columns: minmax(0, 1fr);
      padding: 12px 0;
    }
    .left {
      position: static;
      max-height: none;
    }
    .livebar,
    .howto {
      display: none !important;
    }
    .card,
    .verdict {
      break-inside: avoid;
    }
  }
</style>
</head>
<body>
<header class="top">
  <div class="top-row">
    <div>
      <a class="brand" href="../" data-i18n="brand"></a>
      <h1 data-toolname data-i18n="toolName"></h1>
      <p class="sub" data-i18n="subtitle"></p>
    </div>
    <div class="actions">
      <button class="btn" id="langButton" type="button"></button>
      <button class="btn primary" id="copyLinkButton" type="button" data-i18n="copyLink"></button>
      <button class="btn" id="copySummaryButton" type="button" data-i18n="copySummary"></button>
      <a class="btn line" id="lineLink" href="#" target="_blank" rel="noopener" data-i18n="line"></a>
      <button class="btn" id="shareButton" type="button" data-i18n="share" hidden></button>
      <a class="btn" id="emailLink" href="mailto:" data-i18n="email"></a>
      <button class="btn" id="printButton" type="button" data-i18n="print"></button>
    </div>
  </div>
  <ul class="chips" id="chips"></ul>
</header>

<main>
  <div class="left">
  <section class="card" id="inputs">
    <button class="reset noprint" id="resetButton" type="button" data-i18n="reset"></button>
    <h2 data-i18n="inputsTitle"></h2>
    <p class="lead" data-i18n="inputsLead"></p>
    <div class="presets noprint" id="presets"></div>
    <div id="siteFields"></div>
    <div id="siteChecks"></div>
    <details>
      <summary data-i18n="advancedTariff"></summary>
      <div id="tariffFields"></div>
    </details>
    <details>
      <summary data-i18n="advancedCost"></summary>
      <div id="costFields"></div>
    </details>
  </section>
  <section class="card howto">
    <h3 data-i18n="howTitle"></h3>
    <ul id="howList"></ul>
  </section>
  </div>

  <div class="stack" id="results">
    <section class="verdict" id="verdict" aria-live="polite">
      <span class="tag" id="verdictTag"></span>
      <h2 id="verdictTitle"></h2>
      <p id="verdictText"></p>
      <p class="why" id="verdictWhy"></p>
    </section>

    <div class="kpis">
      <div class="kpi"><div class="label" data-i18n="kpiSize"></div><div class="value" id="kpiSize">–</div><div class="note" id="kpiSizeNote"></div></div>
      <div class="kpi"><div class="label" data-i18n="kpiPayback"></div><div class="value" id="kpiPayback">–</div><div class="note" id="kpiPaybackNote"></div></div>
      <div class="kpi"><div class="label" data-i18n="kpiIrr"></div><div class="value" id="kpiIrr">–</div><div class="note" data-i18n="kpiIrrNote"></div></div>
      <div class="kpi"><div class="label" data-i18n="kpiNpv"></div><div class="value" id="kpiNpv">–</div><div class="note" id="kpiNpvNote"></div></div>
    </div>

    <section class="card">
      <h3 data-i18n="chartTitle"></h3>
      <div class="chartbox"><canvas id="cashChart" role="img"></canvas></div>
    </section>

    <section class="card" id="quoteCard">
      <h3 data-i18n="quoteTitle"></h3>
      <p class="lead" data-i18n="quoteLead"></p>
      <div class="quote-grid">
        <div>
          <div id="quoteFields"></div>
          <div class="stat"><span data-i18n="maxFair"></span><b id="maxFair">–</b></div>
          <div class="stat"><span data-i18n="price7"></span><b id="price7">–</b></div>
          <div class="stat"><span data-i18n="refPrice"></span><b id="refPrice">–</b></div>
        </div>
        <div id="quoteResult"></div>
      </div>
    </section>

    <section class="card">
      <h3 data-i18n="sensTitle"></h3>
      <p class="lead" data-i18n="sensLead"></p>
      <div class="tablewrap"><table id="sensTable"></table></div>
    </section>

    <section class="card">
      <h3 data-i18n="detailTitle"></h3>
      <div class="tablewrap"><table id="detailTable"></table></div>
    </section>

    <section class="card">
      <h3 data-i18n="sizeTableTitle"></h3>
      <div class="tablewrap"><table id="sizeTable"></table></div>
      <p class="sizenote" id="sizeNote"></p>
    </section>

    <section class="card">
      <h3 data-i18n="nextTitle"></h3>
      <ol class="steps" id="nextSteps"></ol>
    </section>

    <div class="notice" id="notice"></div>
  </div>
</main>

<footer>
  <div data-i18n="sources"></div>
  <div class="noprint" data-i18n="disclaimer"></div>
</footer>
<button class="livebar" id="livebar" type="button" aria-label="results"></button>
<div class="toast" id="toast" role="status"></div>
<pre id="testout" hidden></pre>

<script>
"use strict";

const I18N = {
  zh: {
    brand: "← 峰值 Peakwise 首頁",
    toolName: "峰值",
    pageTitle: "峰值 Peakwise｜工廠儲能值不值得",
    subtitle: "工廠裝儲能划不划算？用台電電費單，60 秒算給你看。",
    chips: ["免登入、免上傳", "不賣電池，立場中立", "不划算會直說", "可檢查廠商報價", "中文 / English"],
    langButton: "English",
    copyLink: "複製連結",
    copySummary: "複製摘要",
    email: "Email 寄出",
    print: "列印 / PDF",
    copied: "已複製，可貼到 LINE 或 Email",
    copyFailed: "無法自動複製，請手動選取網址",
    inputsTitle: "工廠資料",
    reset: "重設",
    line: "LINE 分享",
    share: "分享",
    presetsLabel: "範例：",
    presets: { small: "小型廠 800 kW", medium: "中型廠 3,000 kW", large: "大型廠 10,000 kW" },
    echoKwh: (v) => `= ${v} 度`,
    echoKw: (v) => `= ${v} kW`,
    rangeWorst: "±20%：最差可能無法回本",
    howTitle: "怎麼算的",

  { id: "omFrac", group: "cost", value: 0.015, step: 0.001, min: 0, max: 0.1 },
  { id: "fade", group: "cost", value: 0.02, step: 0.005, min: 0, max: 0.2 },
  { id: "cycleLife", group: "cost", value: 6000, step: 500, min: 500, max: 20000 },
  { id: "lifeYears", group: "cost", value: 15, step: 1, min: 5, max: 30 },
  { id: "discount", group: "cost", value: 0.06, step: 0.005, min: 0, max: 0.3 },
  { id: "summerWorkdays", group: "cost", value: 106, step: 1, min: 1, max: 153 },
  { id: "nonsummerWorkdays", group: "cost", value: 142, step: 1, min: 1, max: 212 },
  { id: "quotePerKwh", group: "quote", value: 0, step: 100, min: 0, max: 60000 },
];

const PRESETS = {
  small: { contractKw: 800, summerPeakKwh: 80000, nonsummerSemiKwh: 160000, criticalKw: 100 },
  medium: { contractKw: 3000, summerPeakKwh: 300000, nonsummerSemiKwh: 600000, criticalKw: 300 },
  large: { contractKw: 10000, summerPeakKwh: 1000000, nonsummerSemiKwh: 2000000, criticalKw: 1000 },
};
const ECHO_FIELDS = { contractKw: "echoKw", summerPeakKwh: "echoKwh", nonsummerSemiKwh: "echoKwh" };

const SUBSIDY_MIN_KWH = 1000;
const SUBSIDY_MAX_KWH = 10000;
const ABSORB_MARGIN = 0.9;          // keep 10 % margin: behind-the-meter energy cannot be exported
const SUMMER_PEAK_HOURS = 6;        // 16:00-22:00
const NONSUMMER_SEMI_HOURS = 15;    // 06-11 and 14-24
const SUMMER_MONTHS = 5;            // summer billing season 5/16-10/15
const NONSUMMER_MONTHS = 7;
const AUGMENTATION_FRACTION = 0.25;
const AUGMENTATION_PRICE_FACTOR = 0.6;
const GOOD_IRR = 0.10;
const GOOD_PAYBACK = 8;
const TARGET_PAYBACK = 7;

const urlParams = new URLSearchParams(location.search);
const browserZh = (navigator.language || "zh").toLowerCase().startsWith("zh");
let language = urlParams.get("lang") === "en" ? "en" : urlParams.get("lang") === "zh" ? "zh" : (browserZh ? "zh" : "en");
let lastChart = null;
let lastSummary = "";
let selfTestMode = location.hash === "#selftest";

function fieldDefault(id) {
  return FIELDS.find((field) => field.id === id).value;
}

function buildForm() {
  const containers = {
    site: document.getElementById("siteFields"),
    check: document.getElementById("siteChecks"),
    tariff: document.getElementById("tariffFields"),
    cost: document.getElementById("costFields"),
    quote: document.getElementById("quoteFields"),
  };
  for (const field of FIELDS) {
    const wrapper = document.createElement("label");
    if (field.group === "check") {
      wrapper.className = "check";
      wrapper.innerHTML =
        `<input type="checkbox" id="${field.id}" ${field.value ? "checked" : ""}>` +
        `<span><span data-field="${field.id}"></span><span class="hint" data-hint="${field.id}"></span></span>`;
    } else {
      wrapper.className = "field";
      wrapper.innerHTML =
        `<span><span data-field="${field.id}"></span><span class="hint" data-hint="${field.id}"></span>` +
        (ECHO_FIELDS[field.id] ? `<span class="echo" id="echo-${field.id}"></span>` : "") + `</span>` +
        `<input type="number" inputmode="decimal" id="${field.id}" value="${field.value}" step="${field.step}" min="${field.min}" max="${field.max}">`;
    }
    containers[field.group].appendChild(wrapper);
  }
  document.querySelectorAll("input").forEach((element) => {
    element.addEventListener("input", render);
  });
}

function restoreFromUrl() {
  for (const field of FIELDS) {
    if (!urlParams.has(field.id)) {
      continue;
    }
    const element = document.getElementById(field.id);
    const raw = urlParams.get(field.id);
    if (field.group === "check") {
      element.checked = raw === "1";
    } else if (raw !== "" && Number.isFinite(parseFloat(raw))) {
      element.value = raw;
    }
  }
}

function writeUrl() {
  if (selfTestMode) {
    return;
  }
  const params = new URLSearchParams();
  params.set("lang", language);
  for (const field of FIELDS) {
    const element = document.getElementById(field.id);
    if (field.group === "check") {
      if (element.checked !== field.value) {
        params.set(field.id, element.checked ? "1" : "0");
      }
    } else if (element.value !== "" && parseFloat(element.value) !== field.value) {
      params.set(field.id, element.value);
    }
  }
  try {
    history.replaceState(null, "", `${location.pathname}?${params.toString()}${location.hash}`);
  } catch (error) {
    // Some browsers block history changes on file:// pages; the calculator still works.
  }
}

function applyLanguage() {
  const strings = I18N[language];
  document.documentElement.lang = language === "zh" ? "zh-Hant" : "en";
  document.title = strings.pageTitle;
  document.querySelectorAll("[data-i18n]").forEach((element) => {
    element.textContent = strings[element.dataset.i18n];
  });
  document.querySelectorAll("[data-field]").forEach((element) => {
    element.textContent = strings.fields[element.dataset.field][0];
  });
  document.querySelectorAll("[data-hint]").forEach((element) => {
    element.textContent = strings.fields[element.dataset.hint][1];
  });
  document.getElementById("langButton").textContent = strings.langButton;
  document.getElementById("chips").innerHTML = strings.chips.map((chip) => `<li>${chip}</li>`).join("");
  document.getElementById("nextSteps").innerHTML = strings.nextSteps.map((step) => `<li>${step}</li>`).join("");
  document.getElementById("notice").textContent = strings.notice;
  document.getElementById("presets").innerHTML =
    `<span>${strings.presetsLabel}</span>` +
    Object.keys(PRESETS).map((key) => `<button class="preset" type="button" data-preset="${key}">${strings.presets[key]}</button>`).join("");
  document.querySelectorAll("[data-preset]").forEach((button) => {
    button.addEventListener("click", () => applyPreset(button.dataset.preset));
  });
  document.getElementById("howList").innerHTML =
    strings.howList.map((item) => `<li>${item}</li>`).join("") +
    `<li><a href="https://github.com/juw12/peakwise" target="_blank" rel="noopener">${strings.sourceLink} →</a></li>`;
}

function applyPreset(key) {
  for (const [id, value] of Object.entries(PRESETS[key])) {
    document.getElementById(id).value = value;
  }
  document.getElementById("fixedSizeKwh").value = 0;
  render();
}

function updateEchoes(p) {
  const strings = I18N[language];
  for (const [id, kind] of Object.entries(ECHO_FIELDS)) {
    const echo = document.getElementById(`echo-${id}`);
    if (echo) {
      echo.textContent = strings[kind](Math.round(p[id]).toLocaleString("en-US"));
    }
  }
  document.querySelectorAll("[data-preset]").forEach((button) => {
    const preset = PRESETS[button.dataset.preset];
    const active = Object.entries(preset).every(([id, value]) => p[id] === value);
    button.classList.toggle("active", active);
  });
}

function readInputs() {
  const values = {};
  for (const field of FIELDS) {
    const element = document.getElementById(field.id);
    if (field.group === "check") {
      values[field.id] = element.checked;
      continue;
    }
    let value = parseFloat(element.value);
    let invalid = false;
    if (!Number.isFinite(value)) {
      value = field.value;
      invalid = element.value !== "";
      if (element.value === "") {
        invalid = true;
      }
    } else if (value < field.min) {
      value = field.min;
      invalid = true;
    } else if (value > field.max) {
      value = field.max;
      invalid = true;
    }
    element.classList.toggle("invalid", invalid);
    values[field.id] = value;
  }
  values.savingsFactor = 1;
  return values;
}

function cycleMargin(sellPrice, buyPrice, p) {
  // NT$ per kWh of nameplate per full cycle (before battery wear)
  const discharged = p.usableFrac;
  const charged = discharged / p.rte;
  return discharged * sellPrice - charged * buyPrice;
}

function demandRatePerKwYear(p) {
  // Taipower bills the regular contract at the summer rate for 5 months and the non-summer rate for 7.
  if (p.peakIsMax) {
    return SUMMER_MONTHS * p.demandRegularSummer + NONSUMMER_MONTHS * p.demandRegularNonsummer;
  }
  return SUMMER_MONTHS * Math.max(0, p.demandRegularSummer - p.demandSemi) +
    NONSUMMER_MONTHS * Math.max(0, p.demandRegularNonsummer - p.demandSemi);
}

function evaluateSize(sizeKwh, p) {
  const powerKw = sizeKwh / p.durationH;
  const grossCapex = p.capexPerKwh * sizeKwh;
  const eligible = p.inPark && p.domesticCells && sizeKwh >= SUBSIDY_MIN_KWH && sizeKwh <= SUBSIDY_MAX_KWH;
  const subsidy = eligible ? Math.min(p.subsidyPerKwh * sizeKwh, 0.5 * grossCapex) : 0;
  const netCapex = grossCapex - subsidy;
  const usableKwh = sizeKwh * p.usableFrac;
  const wearPerCycle = netCapex / sizeKwh / p.cycleLife;

  const summerDaysPerMonth = p.summerWorkdays / SUMMER_MONTHS;
  const nonsummerDaysPerMonth = p.nonsummerWorkdays / NONSUMMER_MONTHS;
  const summerPeakDaily = (p.summerPeakKwh / summerDaysPerMonth) * ABSORB_MARGIN;
  const nonsummerSemiDaily = (p.nonsummerSemiKwh / nonsummerDaysPerMonth) * ABSORB_MARGIN;
  const summerFirstUse = Math.min(usableKwh, summerPeakDaily);

  const options = [
    { margin: cycleMargin(p.summerPeak, p.summerOff, p), days: p.summerWorkdays, absorb: summerPeakDaily },
    { margin: cycleMargin(p.summerPeak, p.summerSemi, p), days: p.summerWorkdays, absorb: summerPeakDaily - summerFirstUse },
    { margin: cycleMargin(p.nonsummerSemi, p.nonsummerOff, p), days: p.nonsummerWorkdays, absorb: nonsummerSemiDaily * 5 / NONSUMMER_SEMI_HOURS },
    { margin: cycleMargin(p.nonsummerSemi, p.nonsummerOff, p), days: p.nonsummerWorkdays, absorb: nonsummerSemiDaily * 10 / NONSUMMER_SEMI_HOURS },
  ];

  let energySaving = 0;
  let cyclesPerYear = 0;
  for (const option of options) {
    const fraction = Math.max(0, Math.min(1, option.absorb / usableKwh));
    if (fraction > 0 && option.margin > wearPerCycle) {
      energySaving += option.margin * fraction * option.days * sizeKwh;
      cyclesPerYear += fraction * option.days;
    }
  }
  energySaving *= p.savingsFactor;

  const summerPeakAvgKw = (p.summerPeakKwh / summerDaysPerMonth) / SUMMER_PEAK_HOURS;
  const shaveKw = Math.max(0, Math.min(powerKw, sizeKwh / SUMMER_PEAK_HOURS, summerPeakAvgKw * ABSORB_MARGIN));
  const demandSaving = shaveKw * demandRatePerKwYear(p) * p.savingsFactor;

  const om = p.omFrac * grossCapex;
  const flows = [-netCapex];
  let lifetimeCycles = 0;
  for (let year = 1; year <= p.lifeYears; year += 1) {
    const health = Math.pow(1 - p.fade, year - 1);
    lifetimeCycles += cyclesPerYear;
    let flow = (energySaving + demandSaving) * health - om;
    if (lifetimeCycles > p.cycleLife && lifetimeCycles - cyclesPerYear <= p.cycleLife) {
      flow -= AUGMENTATION_FRACTION * grossCapex * AUGMENTATION_PRICE_FACTOR;
    }
    flows.push(flow);
  }

  let npv = 0;
  const cumulative = [];
  let running = 0;
  flows.forEach((flow, year) => {
    npv += flow / Math.pow(1 + p.discount, year);
    running += flow;
    cumulative.push(running);
  });
  const paybackIndex = cumulative.findIndex((value) => value >= 0);

  return {
    sizeKwh,
    powerKw,
    eligible,
    grossCapex,
    subsidy,
    netCapex,
    energySaving,
    demandSaving,
    om,
    cyclesPerYear,
    npv,
    irr: internalRate(flows),
    payback: paybackIndex >= 0 ? paybackIndex : null,
    cumulative,
    backupHours: p.criticalKw > 0 ? usableKwh / p.criticalKw : null,
  };
}

function internalRate(flows) {
  const total = flows.reduce((sum, flow) => sum + flow, 0);
  if (total <= 0) {
    return null;
  }
  let low = -0.5;
  let high = 1.0;
  let mid = 0;
  for (let iteration = 0; iteration < 200; iteration += 1) {
    mid = (low + high) / 2;
    const value = flows.reduce((sum, flow, year) => sum + flow / Math.pow(1 + mid, year), 0);
    if (value > 0) {
      low = mid;
    } else {
      high = mid;
    }
  }
  return mid;
}

function evaluateAll(p) {
  // Battery power must not exceed the contract capacity or the average 16-22 peak-hour load
  const summerDaysPerMonth = p.summerWorkdays / SUMMER_MONTHS;
  const summerPeakAvgKw = (p.summerPeakKwh / summerDaysPerMonth) / SUMMER_PEAK_HOURS;
  const maxPowerKw = Math.min(p.contractKw, summerPeakAvgKw * ABSORB_MARGIN);
  const candidates = [];
  for (let size = 500; size <= 10000; size += 500) {
    if (size / p.durationH <= maxPowerKw || size === 500) {
      candidates.push(evaluateSize(size, p));
    }
  }
  let best;
  if (p.fixedSizeKwh > 0) {
    best = evaluateSize(p.fixedSizeKwh, p);
  } else {
    best = candidates.reduce((top, item) => (item.npv > top.npv ? item : top), candidates[0]);
  }
  return { best, candidates };
}

function highestPrice(sizeKwh, p, accept) {
  // Largest build cost (NT$/kWh) for which accept(result) still holds; results are monotonic in price.
  const low = 500;
  const high = 60000;
  const at = (price) => evaluateSize(sizeKwh, { ...p, capexPerKwh: price });
  if (!accept(at(low))) {
    return null;
  }
  if (accept(at(high))) {
    return Infinity;
  }
  let lo = low;
  let hi = high;
  for (let iteration = 0; iteration < 40; iteration += 1) {
    const mid = (lo + hi) / 2;
    if (accept(at(mid))) {
      lo = mid;
    } else {
      hi = mid;
    }
  }
  return lo;
}

function sensitivity(sizeKwh, p) {
  return {
    base: evaluateSize(sizeKwh, p),
    costUp: evaluateSize(sizeKwh, { ...p, capexPerKwh: p.capexPerKwh * 1.2 }),
    costDown: evaluateSize(sizeKwh, { ...p, capexPerKwh: p.capexPerKwh * 0.8 }),
    savingsDown: evaluateSize(sizeKwh, { ...p, savingsFactor: 0.8 }),
    savingsUp: evaluateSize(sizeKwh, { ...p, savingsFactor: 1.2 }),
    noSubsidy: evaluateSize(sizeKwh, { ...p, subsidyPerKwh: 0 }),
  };
}

function classify(result) {
  if (result.payback === null || result.npv <= 0) {
    return "bad";
  }
  if (result.irr !== null && result.irr >= GOOD_IRR && result.payback <= GOOD_PAYBACK) {
    return "good";
  }
  return "maybe";
}

function money(value) {
  if (language === "zh") {
    return `NT$ ${Math.round(value / 1e4).toLocaleString("en-US")} 萬`;
  }
  return `NT$ ${(value / 1e6).toFixed(1)} M`;
}

function fullNtd(value) {
  return "NT$ " + Math.round(value).toLocaleString("en-US");
}

function perKwh(value) {
  if (value === null) {
    return "–";
  }
  if (value === Infinity) {
    return "> NT$ 60,000";
  }
  return "NT$ " + (Math.round(value / 100) * 100).toLocaleString("en-US");
}

function pct(value) {
  return value === null ? "–" : `${(value * 100).toFixed(1)} %`;
}

function paybackText(result) {
  const strings = I18N[language];
  return result.payback === null ? strings.never : `${result.payback} ${strings.yearsShort}`;
}

function signedMoneyCell(value) {
  return `<td class="${value < 0 ? "neg" : ""}">${money(value)}</td>`;
}

function render() {
  const p = readInputs();
  const strings = I18N[language];
  const { best, candidates } = evaluateAll(p);
  const scenarios = sensitivity(best.sizeKwh, p);
  updateEchoes(p);
  const kind = classify(best);

  const rangePaybacks = [scenarios.base, scenarios.costUp, scenarios.costDown, scenarios.savingsDown, scenarios.savingsUp]
    .map((item) => item.payback);
  const rangeHi = rangePaybacks.some((value) => value === null) ? null : Math.max(...rangePaybacks);
  const rangeLo = Math.min(...rangePaybacks.filter((value) => value !== null));

  const maxFair = highestPrice(best.sizeKwh, p, (result) => result.npv >= 0);
  const price7 = highestPrice(best.sizeKwh, p, (result) => result.payback !== null && result.payback <= TARGET_PAYBACK);

  const sizeText = (best.sizeKwh / 1000).toFixed(1);
  const powerText = (best.powerKw / 1000).toFixed(2);
  const verdictData = {
    kind,
    size: sizeText,
    power: powerText,
    payback: best.payback,
    rangeLo,
    rangeHi,
    net: money(best.netCapex),
    npv: money(best.npv),
    spread: (p.summerPeak - p.summerOff).toFixed(2),
    subsidy: best.subsidy > 0 ? money(best.subsidy) : "",
  };

  const verdict = document.getElementById("verdict");
  verdict.className = `verdict ${kind}`;
  document.getElementById("verdictTag").textContent = strings.verdictTags[kind];
  document.getElementById("verdictTitle").textContent = strings.verdictTitles[kind];
  document.getElementById("verdictText").textContent = strings.verdictText(verdictData);
  let why;
  if (kind === "good") {
    why = strings.whyGood(verdictData);
  } else if (kind === "maybe") {
    why = strings.whyMaybe();
  } else if (!best.eligible && scenarios.noSubsidy.npv <= 0 && p.subsidyPerKwh > 0 && (!p.inPark || !p.domesticCells || best.sizeKwh < SUBSIDY_MIN_KWH)) {
    why = strings.whyNoSubsidy();
  } else {
    why = strings.whyLowUse();
  }
  document.getElementById("verdictWhy").textContent = why;

  for (const id of ["kpiSize", "kpiPayback", "kpiIrr", "kpiNpv"]) {
    document.getElementById(id).className = `value ${kind === "good" ? "" : kind}`;
  }
  document.getElementById("kpiSize").textContent = `${sizeText} MWh`;
  document.getElementById("kpiSizeNote").textContent = `${powerText} MW · ${money(best.netCapex)}`;
  document.getElementById("kpiPayback").textContent = paybackText(best);
  document.getElementById("kpiPaybackNote").textContent =
    rangeHi === null ? strings.rangeWorst : `±20%: ${rangeLo}–${rangeHi} ${strings.yearsShort}`;
  document.getElementById("kpiIrr").textContent = pct(best.irr);
  document.getElementById("kpiNpv").textContent = money(best.npv);
  document.getElementById("kpiNpvNote").textContent = `@ ${(p.discount * 100).toFixed(1)} %`;

  // Quote check
  document.getElementById("maxFair").textContent = perKwh(maxFair);
  document.getElementById("price7").textContent = perKwh(price7);
  document.getElementById("refPrice").textContent = perKwh(p.capexPerKwh);
  const quoteBox = document.getElementById("quoteResult");
  if (p.quotePerKwh > 0) {
    const atQuote = evaluateSize(best.sizeKwh, { ...p, capexPerKwh: p.quotePerKwh });
    let pill;
    if (maxFair === null) {
      pill = `<div class="pill bad">${strings.quoteBad("100+")}</div>`;
    } else if (maxFair === Infinity || p.quotePerKwh <= maxFair) {
      const gap = maxFair === Infinity ? "50+" : Math.round((1 - p.quotePerKwh / maxFair) * 100);
      pill = `<div class="pill good">${strings.quoteGood(gap)}</div>`;
    } else {
      const gap = Math.round((p.quotePerKwh / maxFair - 1) * 100);
      pill = `<div class="pill bad">${strings.quoteBad(gap)}</div>`;
    }
    quoteBox.innerHTML =
      `<h3>${strings.quoteAt(Math.round(p.quotePerKwh).toLocaleString("en-US"))}</h3>` +
      `<div class="stat"><span>${strings.kpiPayback}</span><b>${paybackText(atQuote)}</b></div>` +
      `<div class="stat"><span>${strings.kpiIrr}</span><b>${pct(atQuote.irr)}</b></div>` +
      `<div class="stat"><span>${strings.kpiNpv}</span><b class="${atQuote.npv < 0 ? "neg" : ""}">${money(atQuote.npv)}</b></div>` +
      pill;
  } else {
    quoteBox.innerHTML = `<div class="pill info">${strings.quoteEmpty}</div>`;
  }

  // Sensitivity
  const sensOrder = ["base", "costUp", "costDown", "savingsDown", "noSubsidy"];
  document.getElementById("sensTable").innerHTML =
    `<tr>${strings.sensCols.map((col) => `<th>${col}</th>`).join("")}</tr>` +
    sensOrder.map((key) => {
      const item = scenarios[key];
      const rowClass = key === "base" ? "best" : "";
      return `<tr class="${rowClass}"><td>${strings.sensRows[key]}</td><td>${paybackText(item)}</td>` +
        `<td>${pct(item.irr)}</td>${signedMoneyCell(item.npv)}</tr>`;
    }).join("");

  // Details
  const rows = strings.rows;
  const detailRows = [
    [rows.power, `${powerText} MW / ${sizeText} MWh`],
    [rows.grossCapex, fullNtd(best.grossCapex)],
    [rows.subsidy, fullNtd(best.subsidy)],
    [rows.netCapex, fullNtd(best.netCapex)],
    [rows.energySaving, fullNtd(best.energySaving)],
    [rows.demandSaving, fullNtd(best.demandSaving)],
    [rows.om, fullNtd(best.om)],
    [rows.cycles, best.cyclesPerYear.toFixed(0)],
    [rows.backup, best.backupHours === null ? "–" : `${best.backupHours.toFixed(1)} ${strings.hours}`],
    [rows.eligibility, best.eligible ? strings.eligible : strings.notEligible],
  ];
  document.getElementById("detailTable").innerHTML = detailRows
    .map(([label, value]) => `<tr><td>${label}</td><td>${value}</td></tr>`)
    .join("");

  // Sizes
  const header = `<tr>${strings.sizeCols.map((col) => `<th>${col}</th>`).join("")}</tr>`;
  const body = candidates
    .filter((item) => item.sizeKwh % 1000 === 0 || item.sizeKwh === best.sizeKwh)
    .map((item) => {
      const rowClass = item.sizeKwh === best.sizeKwh ? "best" : "";
      return (
        `<tr class="${rowClass}"><td>${(item.sizeKwh / 1000).toFixed(1)}</td>` +
        `<td>${money(item.netCapex)}</td>` +
        `<td>${money(item.energySaving + item.demandSaving)}</td>` +
        `<td>${paybackText(item)}</td>` +
        `<td>${pct(item.irr)}</td>` +
        signedMoneyCell(item.npv) + "</tr>"
      );
    })
    .join("");
  document.getElementById("sizeTable").innerHTML = header + body;
  const paybacks = new Set(candidates.map((item) => item.payback));
  document.getElementById("sizeNote").textContent =
    candidates.length > 1 && paybacks.size === 1 && best.payback !== null ? strings.sizeNoteSame : strings.sizeNoteBest;

  const livebar = document.getElementById("livebar");
  livebar.className = `livebar ${kind}`;
  livebar.innerHTML =
    `<span>${strings.livebar({ tag: strings.verdictTags[kind], payback: paybackText(best), irr: pct(best.irr) })}</span>` +
    `<b>${strings.livebarCta}</b>`;

  lastChart = { cumulative: best.cumulative, payback: best.payback };
  drawChart();
  writeUrl();

  const rangeText = rangeHi === null || rangeLo === rangeHi ? "" : ` (±20%: ${rangeLo}–${rangeHi} ${strings.yearsShort})`;
  const summaryData = {
    title: strings.verdictTitles[kind],
    size: sizeText,
    power: powerText,
    net: money(best.netCapex),
    subsidyText: money(best.subsidy),
    paybackText: paybackText(best),
    rangeText,
    irr: pct(best.irr),
    npv: money(best.npv),
    maxFair: perKwh(maxFair),
    url: location.href,
  };
  lastSummary = [strings.summaryTitle, ...strings.summaryLines(summaryData)].join("\n");
  document.getElementById("lineLink").href =
    `https://social-plugins.line.me/lineit/share?url=${encodeURIComponent(location.href)}`;
  document.getElementById("emailLink").href =
    `mailto:?subject=${encodeURIComponent(strings.summaryTitle)}&body=${encodeURIComponent(lastSummary)}`;
  return { best, candidates, scenarios, maxFair, price7, kind };
}

function niceStep(span, targetTicks) {
  const raw = span / targetTicks;
  const magnitude = Math.pow(10, Math.floor(Math.log10(raw)));
  const residual = raw / magnitude;
  const nice = residual >= 5 ? 10 : residual >= 2 ? 5 : residual >= 1 ? 2 : 1;
  return nice * magnitude;
}

function drawChart() {
  if (!lastChart) {
    return;
  }
  const canvas = document.getElementById("cashChart");
  const ratio = window.devicePixelRatio || 1;
  const cssWidth = Math.max(260, canvas.clientWidth || 600);
  const cssHeight = 240;
  canvas.width = Math.round(cssWidth * ratio);
  canvas.height = Math.round(cssHeight * ratio);
  const context = canvas.getContext("2d");
  context.setTransform(ratio, 0, 0, ratio, 0, 0);
  context.clearRect(0, 0, cssWidth, cssHeight);

  const values = lastChart.cumulative.map((value) => value / 1e6);
  const unit = language === "zh" ? "百萬" : "M";
  const padLeft = 48;
  const padRight = 14;
  const padTop = 14;
  const padBottom = 30;
  let maxValue = Math.max(...values, 0);
  let minValue = Math.min(...values, 0);
  if (maxValue === minValue) {
    maxValue += 1;
  }
  const step = niceStep(maxValue - minValue, 5);
  maxValue = Math.ceil(maxValue / step) * step;
  minValue = Math.floor(minValue / step) * step;
  const span = maxValue - minValue || 1;
  const plotWidth = cssWidth - padLeft - padRight;
  const plotHeight = cssHeight - padTop - padBottom;
  const x = (index) => padLeft + (index / (values.length - 1)) * plotWidth;
  const y = (value) => padTop + ((maxValue - value) / span) * plotHeight;

  context.font = "11px 'Segoe UI', 'Microsoft JhengHei', sans-serif";
  context.textBaseline = "middle";
  for (let tick = minValue; tick <= maxValue + 1e-9; tick += step) {
    context.strokeStyle = Math.abs(tick) < 1e-9 ? "#8a97a3" : "#e6ebef";
    context.lineWidth = 1;
    context.beginPath();
    context.moveTo(padLeft, y(tick));
    context.lineTo(cssWidth - padRight, y(tick));
    context.stroke();
    context.fillStyle = "#5b6b7b";
    context.textAlign = "right";
    context.fillText(`${Math.round(tick)}`, padLeft - 6, y(tick));
  }
  context.save();
  context.translate(11, padTop + plotHeight / 2);
  context.rotate(-Math.PI / 2);
  context.textAlign = "center";
  context.fillText(`NT$ ${unit}`, 0, 0);
  context.restore();

  const labelEvery = plotWidth > 480 ? 1 : 3;
  context.textAlign = "center";
  context.textBaseline = "top";
  values.forEach((value, index) => {
    if (index % labelEvery === 0 || index === values.length - 1) {
      context.fillText(String(index), x(index), cssHeight - padBottom + 8);
    }
  });

  // shaded areas
  const zeroY = y(0);
  context.beginPath();
  context.moveTo(x(0), zeroY);
  values.forEach((value, index) => context.lineTo(x(index), y(value)));
  context.lineTo(x(values.length - 1), zeroY);
  context.closePath();
  context.save();
  context.clip();
  context.fillStyle = "rgba(34, 192, 143, 0.16)";
  context.fillRect(padLeft, padTop, plotWidth, zeroY - padTop);
  context.fillStyle = "rgba(180, 35, 24, 0.10)";
  context.fillRect(padLeft, zeroY, plotWidth, padTop + plotHeight - zeroY);
  context.restore();

  context.strokeStyle = "#0f7b5f";
  context.lineWidth = 2.5;
  context.beginPath();
  values.forEach((value, index) => {
    if (index === 0) {
      context.moveTo(x(index), y(value));
    } else {
      context.lineTo(x(index), y(value));
    }
  });
  context.stroke();

  if (lastChart.payback !== null) {
    const px = x(lastChart.payback);
    context.setLineDash([4, 4]);
    context.strokeStyle = "#0f7b5f";
    context.lineWidth = 1;
    context.beginPath();
    context.moveTo(px, padTop);
    context.lineTo(px, padTop + plotHeight);
    context.stroke();
    context.setLineDash([]);
    const label = language === "zh" ? `第 ${lastChart.payback} 年回本` : `Payback, year ${lastChart.payback}`;
    context.font = "bold 12px 'Segoe UI', 'Microsoft JhengHei', sans-serif";
    context.textBaseline = "top";
    context.textAlign = px > cssWidth - 120 ? "right" : "left";
    context.fillStyle = "#0f7b5f";
    context.fillText(label, px + (context.textAlign === "left" ? 6 : -6), padTop + 2);
  }
  const caption = language === "zh" ? "年" : "year";
  context.font = "11px 'Segoe UI', 'Microsoft JhengHei', sans-serif";
  context.fillStyle = "#5b6b7b";
  context.textAlign = "right";
  context.textBaseline = "top";
  context.fillText(caption, cssWidth - padRight, cssHeight - 12);
  canvas.setAttribute("aria-label", I18N[language].chartTitle);
}

function showToast(message) {
  const toast = document.getElementById("toast");
  toast.textContent = message;
  toast.classList.add("show");
  clearTimeout(showToast.timer);
  showToast.timer = setTimeout(() => toast.classList.remove("show"), 2200);
}

function copyText(text) {
  const strings = I18N[language];
  const fallback = () => {
    const area = document.createElement("textarea");
    area.value = text;
    area.style.position = "fixed";
    area.style.opacity = "0";
    document.body.appendChild(area);
    area.select();
    let ok = false;
    try {
      ok = document.execCommand("copy");
    } catch (error) {
      ok = false;
    }
    area.remove();
    showToast(ok ? strings.copied : strings.copyFailed);
  };
  if (navigator.clipboard && window.isSecureContext) {
    navigator.clipboard.writeText(text).then(() => showToast(strings.copied), fallback);
  } else {
    fallback();
  }
}

}
